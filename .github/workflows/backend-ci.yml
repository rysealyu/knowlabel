name: Backend CI

on:
  pull_request:
    branches:
      - main

jobs:
  # Detects whether the PR touches backend files.
  # Runs on every PR so the required check below is always reported.
  backend-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Backend Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'

  backend-build:
    needs: backend-changes
    # Skipped (counts as passing for required checks) when no backend files changed
    if: needs.backend-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    # Only run commands in the ./backend directory
    defaults:
      run:
        working-directory: ./backend

    steps:
        # 1. Clone the Repository
      - name: Checkout Code
        uses: actions/checkout@v4

        # 2. Download Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
            java-version: '21'
            distribution: 'temurin'
            cache: 'maven'

        # 3. Check Code Style Violations
      - name: Check Code Syntax and Style
        run: | 
          ./mvnw checkstyle:check

        # 4. Create a Software Bill of Materials
      - name: Generate Software Bill of Materials (SBOM)
        run: |
          ./mvnw --batch-mode cyclonedx:makeAggregateBom
        
        # 5. Scan the SBOM for Dependency Vulnerabilities
      - name: Scan SBOM with Grype
        uses: anchore/scan-action@v7
        with:
            sbom: 'backend/target/bom.json'
            fail-build: true
            severity-cutoff: 'high'

        # 6. Builds, Tests, and Verifies the Backend
      - name: Build, Test, and Verify
        run: ./mvnw --batch-mode verify
        
        # 7. Store the final compiled jAR as a downloadable workflow artifact
      - name: Archive JAR Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
            name: backend-package
            path: backend/target/*.jar
            retention-days: 7